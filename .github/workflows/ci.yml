name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: make test

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Coverage floor
        run: make cover-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: make build

  # The built binary's integration checks run inside each distro container:
  # static Go binary + shimmed ssh/crontab/ping/ip, so what this proves is
  # that the shell-outs behave across distros.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build static binary
        run: CGO_ENABLED=0 make build
      - name: Run integration checks in distro containers
        run: |
          set -eu
          for img in debian:stable ubuntu:latest fedora:latest alpine:latest archlinux:latest; do
            echo "=== $img ==="
            docker run --rm -v "$PWD:/src" -w /src "$img" sh tests/integration.sh ./bin/wake
          done
