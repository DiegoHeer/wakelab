version: 2

project_name: wakelab

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - id: wake
    main: ./cmd/wake
    binary: wake
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/DiegoHeer/wakelab/internal/cli.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^ci'
      - '^style'
      - '^test'

# Casks work on Linuxbrew too since Homebrew 4.5 (plain `binary` artifacts);
# the old formula lives on in the tap's git history.
homebrew_casks:
  - name: wakelab
    repository:
      owner: DiegoHeer
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/DiegoHeer/wakelab
    description: "Wake and sleep your whole homelab from the CLI"
    binaries:
      - wake
    completions:
      bash: completions/wake.bash
      zsh: completions/_wake
      fish: completions/wake.fish
    caveats: |
      Run this once to enable tab completion in your shell:
        wake completion install
    commit_author:
      name: goreleaser
      email: diego.heer@odido.nl
    hooks:
      post:
        # The binaries are not Apple-signed; strip the quarantine bit on macOS.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wake"]
          end
