version: "2"

run:
  timeout: 3m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused are enabled by default.
  enable:
    - misspell
    - revive
  settings:
    errcheck:
      # CLI output to injected writers: checking every print would drown the
      # command code in noise for errors we cannot act on.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
